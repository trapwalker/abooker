# Generic standalone-nginx template (own nginx process/container just for
# abooker, listening on 80/443 itself). For the actual sl2 deployment, which
# shares an existing nginx container with other sites, use
# ab.sublayers.net.conf instead — it proxies to a different local port and
# adds the /_internal_files/ internal location for X-Accel-Redirect.
server {
    listen 80;
    server_name example.com;          # замените на ваш домен

    # Перенаправление HTTP → HTTPS (раскомментируйте после настройки SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Увеличенные таймауты для lazy-загрузки файлов
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Буферизация отключена — файлы отдаются потоком
        proxy_buffering off;
    }
}

