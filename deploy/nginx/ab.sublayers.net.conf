# abooker vhost for the shared nginx container on the VDS.
# Deploy: copy into /home/svp/nginx/sites/ab.sublayers.net.conf, then
# `docker compose exec nginx nginx -t && docker compose restart nginx`
# (see deploy/DEPLOY.md for the full, phased — HTTP first, then cert, then
# HTTPS — rollout on a domain that doesn't have a certificate yet).

# HTTP: ACME challenge + redirect everything else to HTTPS
server {
    listen 80;
    server_name ab.sublayers.net;

    location /.well-known/acme-challenge/ {
        root /var/certbot;
    }

    location / {
        return 301 https://ab.sublayers.net$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name ab.sublayers.net;

    ssl_certificate     /etc/letsencrypt/live/ab.sublayers.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ab.sublayers.net/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # sendfile causes large file transfer hangs in Docker on KVM/QEMU (matches
    # the workaround already in place for sublayers.net's own vhost).
    sendfile off;

    access_log /var/log/nginx/ab.sublayers.net-access.log;
    error_log  /var/log/nginx/ab.sublayers.net-error.log;

    client_max_body_size 20m;

    # Audio bytes served straight from disk by nginx (abooker sends
    # X-Accel-Redirect here instead of streaming files itself) — internal
    # only, never reachable directly from outside.
    location /_internal_files/ {
        internal;
        alias DATA_DIR_PLACEHOLDER/;
        # nginx natively serves Range requests here, which podcast apps rely
        # on for seeking within a chapter.
    }

    location / {
        proxy_pass         http://host.docker.internal:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;   # requests fail fast (503) now, no long holds
        proxy_send_timeout    30s;
        proxy_buffering off;
    }
}
