[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abooker"
version = "0.1.0"
description = "Audio book RSS builder for web server"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "trapwalker", email = "svpmailbox@gmail.com" }]
keywords = ["rss", "abook", "audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies = [
    "click",
    "pyyaml",
    "charset-normalizer",
    "yt-dlp",
]

[project.scripts]
abooker = "abooker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abooker"]
