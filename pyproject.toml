[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abooker"
version = "0.1.0"
description = "Audio book RSS builder for web server"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "trapwalker", email = "svpmailbox@gmail.com" }]
keywords = ["rss", "abook", "audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies = [
    "click",
    "pyyaml",
    "charset-normalizer",
    "yt-dlp",
]

[project.optional-dependencies]
core = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "pydantic-settings>=2.0",
    "unidecode",
]
web = [
    "fastapi",
    "uvicorn[standard]",
    "aiofiles",
    "abooker[core]",
]
bot = [
    "aiogram>=3.0",
    "qbittorrent-api",
    "aiohttp",
    "abooker[core]",
]
all = ["abooker[bot,web,core]"]

[project.scripts]
abooker = "abooker.cli:main"
abooker-web = "abooker.web.main:run"
abooker-bot = "abooker.bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/abooker"]
